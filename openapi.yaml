    PeerSection:
      type: object
      description: |
        What a peer service returned, passed through as-is, or `{"error": "..."}`
        when the peer is not configured or failed.
      additionalProperties: true
      example:
        error: peer not configured

    PatientSummary:
      type: object
      required:
        - patient
        - appointments
        - ehr
        - insurance
      properties:
        patient:
          $ref: '#/components/schemas/Patient'
        appointments:
          $ref: '#/components/schemas/PeerSection'
        ehr:
          $ref: '#/components/schemas/PeerSection'
        insurance:
          $ref: '#/components/schemas/PeerSection'
      additionalProperties: false
      example:
        patient:
          id: 1001
          medical_record_number: MRN-000123
          mrn: MRN-000123
          identity_sub: null
          status: active
          created_at: '2026-08-12T09:14:22.481930+00:00'
          updated_at: '2026-08-12T09:14:22.481930+00:00'
          first_name: Ada
          last_name: Lovelace
          dob: '1990-01-01'
        appointments:
          count: 0
          items: []
        ehr:
          error: peer not configured
        insurance:
          error: 'HTTP 503: upstream unavailable'

    DeactivateResponse:
      type: object
      required:
        - deactivated
      properties:
        deactivated:
          type: integer
          format: int64
          description: Id of the record that was set to `inactive`.
      additionalProperties: false
      example:
        deactivated: 1001

    HealthStatus:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: patients-service
      additionalProperties: false

    ReadinessStatus:
      type: object
      required:
        - status
        - service
        - problems
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: patients-service
        problems:
          type: array
          description: One entry per failed dependency check. Empty when `status` is `ok`.
          items:
            type: string
      additionalProperties: false

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable failure message.
      additionalProperties: false

    ScopeError:
      type: object
      description: Returned on `403`, carries the scope gap alongside the message.
      required:
        - error
        - required
        - have
      properties:
        error:
          type: string
          const: insufficient scope
        required:
          type: array
          description: Scopes the operation demands.
          items:
            type: string
        have:
          type: array
          description: Scopes present on the presented token, sorted.
          items:
            type: string
      additionalProperties: false
