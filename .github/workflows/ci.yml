name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install shared lib
        # In the monorepo the lib is a sibling. When each service becomes its
        # own repo, replace this step with `pip install py-healthcare-common`
        # from a private index (or vendor via submodule).
        run: |
          if [ -d ../../libs/py-healthcare-common ]; then
            pip install -e ../../libs/py-healthcare-common[dev]
          else
            pip install py-healthcare-common
          fi
      - run: pip install -r requirements.txt pytest pytest-mock responses
      - run: pytest -q
