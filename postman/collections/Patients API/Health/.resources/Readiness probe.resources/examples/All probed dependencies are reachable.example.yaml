$kind: http-example
name: All probed dependencies are reachable.
request:
  url: '{{baseUrl}}/ready'
  method: GET
  headers:
  - key: Accept
    value: application/json
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "service": "patients-service",
        "problems": []
      }
order: 1000
