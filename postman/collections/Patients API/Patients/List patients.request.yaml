$kind: http-request
description: |
  Returns a page of patients plus the total count matching the filter,
  ordered by `id` ascending.

  **Ad-hoc filtering.** `status` is an exact match on the envelope column.
  Any query parameter named `data.<key>` is compiled to
  `data->>'<key>' = '<value>'` (for example `data.city=Boston`); several
  filters are ANDed. Any other query parameter is ignored. Because the set
  of `data.<key>` names is open-ended it cannot be enumerated here.

  Requires scope `patients.read`.

  Publishes: `audit.event` (`patient.list`).
url: '{{baseUrl}}/api/patients/?limit=25&offset=0&status=active'
method: GET
headers:
- key: X-Request-ID
  value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
  disabled: false
  description: |
    Correlation id propagated across HTTP hops and onto published events.
    Generated by the service if omitted, and echoed on every response.
- key: Accept
  value: application/json
queryParams:
- key: limit
  value: '25'
  disabled: false
  description: |
    Page size. Defaults to 50. Values above 500 are silently clamped to
    500 rather than rejected.
- key: offset
  value: '0'
  disabled: false
  description: Number of rows to skip, applied after ordering by `id` ascending.
- key: status
  value: active
  disabled: false
  description: Exact match on the envelope `status` column (not on `data`).
settings: {}
examples: ./.resources/List patients.resources/examples
order: 2000
scripts:
- type: afterResponse
  code: |
    function checkPatient(p) {
      // Envelope fields are the contract consumers rely on; extra keys are expected.
      pm.expect(p).to.include.all.keys("id", "mrn", "identity_sub", "status", "created_at", "updated_at");
      pm.expect(p.id).to.be.a("number");
      pm.expect(p.status).to.be.a("string");
    }
    pm.test("200 and a page of patients", () => { pm.response.to.have.status(200); const b = pm.response.json(); pm.expect(b).to.include.all.keys("count", "items"); pm.expect(b.count).to.be.a("number"); pm.expect(b.items).to.be.an("array"); b.items.forEach(checkPatient); });
  language: text/javascript
