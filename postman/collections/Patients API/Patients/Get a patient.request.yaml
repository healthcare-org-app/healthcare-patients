$kind: http-request
description: |
  Fetches a single patient by id. Deactivated patients are still returned,
  with `status` set to `inactive`.

  Requires scope `patients.read`.

  Publishes: `audit.event` (`patient.read`).
url: '{{baseUrl}}/api/patients/:patient_id'
method: GET
headers:
- key: X-Request-ID
  value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
  disabled: false
  description: |
    Correlation id propagated across HTTP hops and onto published events.
    Generated by the service if omitted, and echoed on every response.
- key: Accept
  value: application/json
pathVariables:
- key: patient_id
  value: '{{patient_id}}'
  disabled: false
  description: (Required) Primary key of the patient record.
settings: {}
examples: ./.resources/Get a patient.resources/examples
order: 3000
scripts:
- type: afterResponse
  code: |
    function checkPatient(p) {
      // Envelope fields are the contract consumers rely on; extra keys are expected.
      pm.expect(p).to.include.all.keys("id", "mrn", "medical_record_number", "identity_sub", "status", "created_at", "updated_at");
      pm.expect(p.medical_record_number).to.equal(p.mrn);
      pm.expect(p.id).to.be.a("number");
      pm.expect(p.status).to.be.a("string");
    }
    pm.test("200 and the patient envelope", () => { pm.response.to.have.status(200); checkPatient(pm.response.json()); });
  language: text/javascript
