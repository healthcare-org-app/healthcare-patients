$kind: http-request
description: |
  Creates a patient. `first_name`, `last_name` and `dob` are required. The
  keys `mrn` and `identity_sub` go to their own (unique) columns; every
  other key is stored verbatim as the record's `data` document.

  Before insert, the service calls `demographics-service` to validate the
  address (when `address` is present) and to filter profanity out of the
  names; after insert it sends a welcome notification through
  `notifications-service`. All three calls are best-effort and never fail
  the create (see the API description).

  Sending an `mrn` or `identity_sub` that already exists violates a unique
  constraint and fails with `500`: the service does not translate it.

  Requires scope `patients.write`.

  Publishes: `patient.created`, `audit.event` (`patient.create`).
url: '{{baseUrl}}/api/patients/'
method: POST
headers:
- key: X-Request-ID
  value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
  disabled: false
  description: |
    Correlation id propagated across HTTP hops and onto published events.
    Generated by the service if omitted, and echoed on every response.
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |-
    {
      "first_name": "Ada",
      "last_name": "Lovelace",
      "dob": "1990-01-01",
      "mrn": "MRN-000123",
      "email": "ada@example.com",
      "phone": "+1-555-0100"
    }
settings: {}
examples: ./.resources/Create a patient.resources/examples
order: 1000
scripts:
- type: afterResponse
  code: |
    function checkPatient(p) {
      // Envelope fields are the contract consumers rely on; extra keys are expected.
      pm.expect(p).to.include.all.keys("id", "mrn", "identity_sub", "status", "created_at", "updated_at");
      pm.expect(p.id).to.be.a("number");
      pm.expect(p.status).to.be.a("string");
    }
    pm.test("201 and the patient envelope", () => { pm.response.to.have.status(201); checkPatient(pm.response.json()); });
    // Later requests act on the record created here.
    if (pm.response.code === 201) { pm.collectionVariables.set("patient_id", String(pm.response.json().id)); }
  language: text/javascript
