$kind: http-example
name: The patient and the peer sections.
request:
  url: '{{baseUrl}}/api/patients/:patient_id/summary'
  method: GET
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
  pathVariables:
  - key: patient_id
    value: '1001'
    disabled: false
    description: (Required) Primary key of the patient record.
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "patient": {
          "id": 1001,
          "mrn": "MRN-000123",
          "identity_sub": null,
          "status": "active",
          "created_at": "2026-08-12T09:14:22.481930+00:00",
          "updated_at": "2026-08-12T09:14:22.481930+00:00",
          "first_name": "Ada",
          "last_name": "Lovelace",
          "dob": "1990-01-01"
        },
        "appointments": {
          "count": 0,
          "items": []
        },
        "ehr": {
          "error": "peer not configured"
        },
        "insurance": {
          "error": "HTTP 503: upstream unavailable"
        }
      }
order: 1000
