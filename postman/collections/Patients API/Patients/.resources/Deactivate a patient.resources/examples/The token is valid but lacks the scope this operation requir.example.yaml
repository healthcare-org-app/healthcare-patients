$kind: http-example
name: The token is valid but lacks the scope this operation requires. Not retryable with the...
request:
  url: '{{baseUrl}}/api/patients/:patient_id'
  method: DELETE
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
  pathVariables:
  - key: patient_id
    value: '1001'
    disabled: false
    description: (Required) Primary key of the patient record.
  body:
    type: text
    content: ''
response:
  statusCode: 403
  statusText: Forbidden
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "error": "insufficient scope",
        "required": [
          "patients.write"
        ],
        "have": [
          "patients.read"
        ]
      }
order: 3000
