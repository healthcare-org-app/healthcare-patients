$kind: http-example
name: No patient exists with the given id. Not retryable.
request:
  url: '{{baseUrl}}/api/patients/:patient_id'
  method: PATCH
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  pathVariables:
  - key: patient_id
    value: '1001'
    disabled: false
    description: (Required) Primary key of the patient record.
  body:
    type: json
    content: |-
      {
        "phone": "+1-555-0199",
        "city": "Boston"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "error": "patient 999999 not found"
      }
order: 4000
