$kind: http-example
name: One or more of `first_name`, `last_name`, `dob` is missing (this includes an empty or u...
request:
  url: '{{baseUrl}}/api/patients/'
  method: POST
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  body:
    type: json
    content: |-
      {
        "first_name": "Ada",
        "last_name": "Lovelace"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "error": "missing fields: dob"
      }
order: 2000
