$kind: http-example
name: The created patient.
request:
  url: '{{baseUrl}}/api/patients/'
  method: POST
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  body:
    type: json
    content: |-
      {
        "first_name": "Ada",
        "last_name": "Lovelace",
        "dob": "1990-01-01",
        "mrn": "MRN-000123",
        "email": "ada@example.com",
        "phone": "+1-555-0100"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "id": 1001,
        "mrn": "MRN-000123",
        "identity_sub": null,
        "status": "active",
        "created_at": "2026-08-12T09:14:22.481930+00:00",
        "updated_at": "2026-08-12T09:14:22.481930+00:00",
        "first_name": "Ada",
        "last_name": "Lovelace",
        "dob": "1990-01-01",
        "email": "ada@example.com",
        "phone": "+1-555-0100"
      }
order: 1000
