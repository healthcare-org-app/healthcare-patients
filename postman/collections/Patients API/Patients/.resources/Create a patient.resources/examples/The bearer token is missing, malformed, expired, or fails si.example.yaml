$kind: http-example
name: The bearer token is missing, malformed, expired, or fails signature verification. Retry...
request:
  url: '{{baseUrl}}/api/patients/'
  method: POST
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  body:
    type: json
    content: |-
      {
        "first_name": "Ada",
        "last_name": "Lovelace",
        "dob": "1990-01-01",
        "mrn": "MRN-000123",
        "email": "ada@example.com",
        "phone": "+1-555-0100"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "error": "missing bearer token"
      }
order: 3000
