$kind: http-example
name: A page of patients.
request:
  url: '{{baseUrl}}/api/patients/?limit=25&offset=0&status=active'
  method: GET
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
  queryParams:
  - key: limit
    value: '25'
    disabled: false
    description: |
      Page size. Defaults to 50. Values above 500 are silently clamped to
      500 rather than rejected.
  - key: offset
    value: '0'
    disabled: false
    description: Number of rows to skip, applied after ordering by `id` ascending.
  - key: status
    value: active
    disabled: false
    description: Exact match on the envelope `status` column (not on `data`).
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
  - key: Content-Type
    value: application/json
  body:
    type: json
    content: |-
      {
        "count": 1,
        "items": [
          {
            "id": 1001,
            "mrn": "MRN-000123",
            "medical_record_number": "MRN-000123",
            "identity_sub": null,
            "status": "active",
            "created_at": "2026-08-12T09:14:22.481930+00:00",
            "updated_at": "2026-08-12T09:14:22.481930+00:00",
            "first_name": "Ada",
            "last_name": "Lovelace",
            "dob": "1990-01-01"
          }
        ]
      }
order: 1000
