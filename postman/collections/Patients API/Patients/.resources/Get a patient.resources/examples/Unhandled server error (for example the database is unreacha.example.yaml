$kind: http-example
name: Unhandled server error (for example the database is unreachable, or a unique `mrn` or `...
request:
  url: '{{baseUrl}}/api/patients/:patient_id'
  method: GET
  headers:
  - key: Authorization
    value: Bearer <token>
    description: 'Added as a part of security scheme: bearer'
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: |
      Correlation id propagated across HTTP hops and onto published events.
      Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
  pathVariables:
  - key: patient_id
    value: '1001'
    disabled: false
    description: (Required) Primary key of the patient record.
  body:
    type: text
    content: ''
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
  - key: Content-Type
    value: text/html
  body:
    type: text
    content: <!doctype html><title>500 Internal Server Error</title><h1>Internal Server Error</h1>
order: 5000
