$kind: http-request
description: |
  Soft delete. Sets `status` to `inactive` and bumps `updated_at`; the row
  and its `data` document are retained and remain readable via
  `GET /api/patients/{patient_id}`.

  Safe to repeat: a second call on an already inactive record still returns
  `200`.

  Requires scope `patients.write`.

  Publishes: `patient.updated`, `audit.event` (`patient.deactivate`).
url: '{{baseUrl}}/api/patients/:patient_id'
method: DELETE
headers:
- key: X-Request-ID
  value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
  disabled: false
  description: |
    Correlation id propagated across HTTP hops and onto published events.
    Generated by the service if omitted, and echoed on every response.
- key: Accept
  value: application/json
pathVariables:
- key: patient_id
  value: '{{patient_id}}'
  disabled: false
  description: (Required) Primary key of the patient record.
settings: {}
examples: ./.resources/Deactivate a patient.resources/examples
order: 6000
scripts:
- type: afterResponse
  code: |
    function checkPatient(p) {
      // Envelope fields are the contract consumers rely on; extra keys are expected.
      pm.expect(p).to.include.all.keys("id", "mrn", "medical_record_number", "identity_sub", "status", "created_at", "updated_at");
      pm.expect(p.mrn).to.eql(p.medical_record_number);
      pm.expect(p.id).to.be.a("number");
      pm.expect(p.status).to.be.a("string");
    }
    pm.test("200 and the deactivated id", () => { pm.response.to.have.status(200); const b = pm.response.json(); pm.expect(b).to.have.property("deactivated"); pm.expect(b.deactivated).to.be.a("number"); });
  language: text/javascript
