$kind: http-request
description: |
  Case-insensitive substring search over `mrn`, `first_name`, `last_name`,
  `email` and `phone`. Returns at most 100 hits, unordered and unpaged;
  `count` is the number of returned items.

  An empty or missing `q` is not an error: it returns `count: 0` and no
  items.

  Requires scope `patients.read`.

  Publishes: `audit.event` (`patient.search`), except when `q` is empty.
url: '{{baseUrl}}/api/patients/search?q=smith'
method: GET
headers:
- key: X-Request-ID
  value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
  disabled: false
  description: |
    Correlation id propagated across HTTP hops and onto published events.
    Generated by the service if omitted, and echoed on every response.
- key: Accept
  value: application/json
queryParams:
- key: q
  value: smith
  disabled: false
  description: Search term, trimmed before use.
settings: {}
examples: ./.resources/Search patients.resources/examples
order: 7000
scripts:
- type: afterResponse
  code: |
    function checkPatient(p) {
      // Envelope fields are the contract consumers rely on; extra keys are expected.
      pm.expect(p).to.include.all.keys("id", "mrn", "medical_record_number", "identity_sub", "status", "created_at", "updated_at");
      pm.expect(p.mrn).to.eql(p.medical_record_number);
      pm.expect(p.id).to.be.a("number");
      pm.expect(p.status).to.be.a("string");
    }
    pm.test("200 and a list of matches", () => { pm.response.to.have.status(200); const b = pm.response.json(); pm.expect(b).to.include.all.keys("count", "items"); pm.expect(b.count).to.be.a("number"); pm.expect(b.items).to.be.an("array"); b.items.forEach(checkPatient); });
  language: text/javascript
