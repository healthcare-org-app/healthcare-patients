$kind: http-request
description: |
  Shallow-merges the request body into the record's existing `data`
  document: keys present in the body overwrite, keys absent are preserved.
  Nested objects are replaced wholesale, not merged recursively.

  `status` and `mrn` are lifted out of the body and written to their
  envelope columns (omitted means unchanged). `id` is stripped and
  ignored. No required-field validation is done on update.

  As on create, `demographics-service` is called best-effort to validate
  the address (when `address` is present) and to filter the names.

  Requires scope `patients.write`.

  Publishes: `patient.updated`, `audit.event` (`patient.update`).
url: '{{baseUrl}}/api/patients/:patient_id'
method: PATCH
headers:
- key: X-Request-ID
  value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
  disabled: false
  description: |
    Correlation id propagated across HTTP hops and onto published events.
    Generated by the service if omitted, and echoed on every response.
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
pathVariables:
- key: patient_id
  value: '{{patient_id}}'
  disabled: false
  description: (Required) Primary key of the patient record.
body:
  type: json
  content: |-
    {
      "phone": "+1-555-0199",
      "city": "Boston"
    }
settings: {}
examples: ./.resources/Update a patient.resources/examples
order: 4000
scripts:
- type: afterResponse
  code: |
    function checkPatient(p) {
      // Envelope fields are the contract consumers rely on; extra keys are expected.
      pm.expect(p).to.include.all.keys("id", "mrn", "medical_record_number", "identity_sub", "status", "created_at", "updated_at");
      pm.expect(p.mrn).to.eql(p.medical_record_number);
      pm.expect(p.id).to.be.a("number");
      pm.expect(p.status).to.be.a("string");
    }
    pm.test("200 and the patient envelope", () => { pm.response.to.have.status(200); checkPatient(pm.response.json()); });
  language: text/javascript
