$kind: http-request
description: |
  Returns the patient plus the linked records of three peer services:
  `appointments` from `appointments-service`, `ehr` from `ehr-service` and
  `insurance` from `eligibility-service`, each queried by `patient_id`.

  Peers are called one after the other. A peer that is not configured or
  that fails (down, or HTTP 4xx/5xx) does not fail the request: its section
  becomes `{"error": "<reason>"}`. Callers must therefore check each
  section for an `error` key.

  Requires scope `patients.read`.

  Publishes: `audit.event` (`patient.summary`).
url: '{{baseUrl}}/api/patients/:patient_id/summary'
method: GET
headers:
- key: X-Request-ID
  value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
  disabled: false
  description: |
    Correlation id propagated across HTTP hops and onto published events.
    Generated by the service if omitted, and echoed on every response.
- key: Accept
  value: application/json
pathVariables:
- key: patient_id
  value: '{{patient_id}}'
  disabled: false
  description: (Required) Primary key of the patient record.
settings: {}
examples: ./.resources/Get a patient summary.resources/examples
order: 8000
scripts:
- type: afterResponse
  code: |
    function checkPatient(p) {
      // Envelope fields are the contract consumers rely on; extra keys are expected.
      pm.expect(p).to.include.all.keys("id", "mrn", "medical_record_number", "identity_sub", "status", "created_at", "updated_at");
      pm.expect(p.id).to.be.a("number");
      pm.expect(p.status).to.be.a("string");
    }
    pm.test("200 and the patient with its peer sections", () => { pm.response.to.have.status(200); const b = pm.response.json(); pm.expect(b).to.include.all.keys("patient", "appointments", "ehr", "insurance"); checkPatient(b.patient); ["appointments", "ehr", "insurance"].forEach(k => pm.expect(b[k]).to.be.an("object")); });
  language: text/javascript
